<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transporter7</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

body{
  min-height:100vh;
}

header{
  background:#07101f;
  color:white;
  padding:24px 18px;
}

header h1{
  margin:0 0 8px;
  font-size:30px;
}

header p{
  margin:0;
  color:#9ca3af;
}

main{
  max-width:1000px;
  margin:0 auto;
  padding:24px 16px 60px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
}

.card h3{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(280px,1fr)
  );
  gap:18px;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.primary{
  background:#173b82;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.big{
  width:100%;
  min-height:58px;
  font-size:20px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
}

.status{
  padding:12px 14px;
  border-radius:10px;
  background:#eef2ff;
  margin:12px 0;
  font-weight:bold;
}

.status.good{
  background:#dcfce7;
  color:#166534;
}

.status.warn{
  background:#fef3c7;
  color:#92400e;
}

.status.bad{
  background:#fee2e2;
  color:#991b1b;
}

.hidden{
  display:none !important;
}

.small{
  font-size:14px;
}

.center{
  text-align:center;
}

/* =====================================================
   DRIVER RIDE ACTION
===================================================== */

#driverRideActionBtn{
  width:100%;
  min-height:58px;
  font-size:20px;
  margin-bottom:12px;
}

/* =====================================================
   RIDE OFFER MODAL
===================================================== */

#rideModal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.70);
  padding:18px;
}

#rideModal.hidden{
  display:none !important;
}

.callBox{
  width:min(540px,100%);
  background:white;
  border-radius:26px;
  padding:26px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
  animation:callIn .18s ease-out;
}

@keyframes callIn{
  from{
    transform:scale(.92);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.phoneIcon{
  font-size:60px;
  text-align:center;
  margin-bottom:4px;
  animation:ring .8s infinite alternate;
}

@keyframes ring{
  from{
    transform:rotate(-8deg);
  }

  to{
    transform:rotate(8deg);
  }
}

.callTitle{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:8px 0 4px;
}

.callSub{
  text-align:center;
  color:#6b7280;
  margin-bottom:16px;
}

.countdown{
  text-align:center;
  font-size:58px;
  font-weight:900;
  line-height:1;
  margin:15px 0 22px;
}

.offerInfo{
  background:#f3f4f6;
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
}

.offerInfo div{
  margin:7px 0;
}

.callButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.callButtons button{
  min-height:64px;
  font-size:20px;
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  z-index:100000;
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
  display:none;
}

#toast.show{
  display:block;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .callBox{
    padding:20px;
  }

  .callTitle{
    font-size:25px;
  }

  .countdown{
    font-size:52px;
  }

  .callButtons{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
  }

  .row>*{
    width:100%;
  }

}

</style>
</head>

<body>

<header>

  <h1>Transporter7</h1>

  <p>
    Multi-driver • Multi-passenger • Real-time
  </p>

</header>


<main>

<!-- =====================================================
     HOME
===================================================== -->

<section
  id="homeSection"
  class="card">

  <h2>Choose App</h2>

  <div class="grid">

    <button
      id="driverAppBtn"
      class="primary big">

      🚗 DRIVER APP

    </button>

    <button
      id="passengerAppBtn"
      class="primary big">

      👤 PASSENGER APP

    </button>

  </div>

  <p
    id="connectionStatus"
    class="status warn">

    Connecting...

  </p>

</section>


<!-- =====================================================
     DRIVER
===================================================== -->

<section
  id="driverSection"
  class="hidden">

  <div class="card">

    <h2>Driver Home</h2>

    <label>
      Driver Name
    </label>

    <input
      id="driverName"
      value="Test Driver">


    <div
      class="row"
      style="margin-top:14px">

      <button
        id="driverOnlineBtn"
        class="success">

        GO ONLINE

      </button>

      <button
        id="driverOfflineBtn"
        class="secondary">

        GO OFFLINE

      </button>

    </div>


    <div
      id="driverStatus"
      class="status">

      Driver is starting...

    </div>


    <!-- =================================================
         CURRENT RIDE
    ================================================== -->

    <div
      id="driverRidePanel"
      class="card hidden">

      <h3>
        Current Ride
      </h3>

      <div
        id="driverRideInfo">
      </div>


      <!--
        ONE BUTTON CONTROLS THE ENTIRE DRIVER FLOW:

        GO PICK UP
        ARRIVED
        START RIDE
        DROP OFF
      -->

      <button
        id="driverRideActionBtn"
        class="primary">

        GO PICK UP

      </button>


      <button
        id="driverCancelBtn"
        class="danger big">

        CANCEL RIDE

      </button>

    </div>


    <button
      id="backFromDriverBtn"
      class="secondary big"
      style="margin-top:16px">

      BACK

    </button>

  </div>

</section>


<!-- =====================================================
     PASSENGER
===================================================== -->

<section
  id="passengerSection"
  class="hidden">

  <div class="card">

    <h2>
      Request a Ride
    </h2>


    <label>
      Passenger Name
    </label>

    <input
      id="passengerName"
      value="Test Passenger">


    <label>
      Pickup
    </label>

    <input
      id="pickup"
      placeholder="Start typing pickup address..."
      autocomplete="off">


    <label>
      Destination
    </label>

    <input
      id="destination"
      placeholder="Start typing destination..."
      autocomplete="off">


    <label>
      Passengers
    </label>

    <input
      id="pax"
      type="number"
      min="1"
      value="1">


    <label>
      Fare / Offer
    </label>

    <input
      id="fare"
      type="number"
      min="0"
      step=".01"
      value="20">


    <button
      id="requestRideBtn"
      class="primary big"
      style="margin-top:18px">

      REQUEST RIDE

    </button>


    <div
      id="passengerStatus"
      class="status">

      Ready.

    </div>


    <div
      id="passengerRidePanel"
      class="card hidden">

      <h3>
        Ride
      </h3>

      <div
        id="passengerRideInfo">
      </div>

      <button
        id="passengerCancelBtn"
        class="danger big"
        style="margin-top:14px">

        CANCEL RIDE

      </button>

    </div>


    <button
      id="backFromPassengerBtn"
      class="secondary big"
      style="margin-top:16px">

      BACK

    </button>

  </div>

</section>

</main>


<!-- =====================================================
     INCOMING RIDE OFFER
===================================================== -->

<div
  id="rideModal"
  class="hidden">

  <div class="callBox">

    <div class="phoneIcon">
      📞
    </div>

    <div class="callTitle">
      NEW RIDE OFFER
    </div>

    <div class="callSub">
      Incoming passenger request
    </div>

    <div
      id="callCountdown"
      class="countdown">

      20

    </div>


    <div class="offerInfo">

      <div>
        <b>Passenger:</b>
        <span id="offerPassenger">-</span>
      </div>

      <div>
        <b>Pickup:</b>
        <span id="offerPickup">-</span>
      </div>

      <div>
        <b>Destination:</b>
        <span id="offerDestination">-</span>
      </div>

      <div>
        <b>Passengers:</b>
        <span id="offerPax">-</span>
      </div>

      <div>
        <b>Fare:</b>
        $<span id="offerFare">0</span>
      </div>

      <div>
        <b>Distance:</b>
        <span id="offerDistance">-</span>
      </div>

    </div>


    <div class="callButtons">

      <button
        id="takeRideBtn"
        class="success">

        TAKE IT

      </button>

      <button
        id="passRideBtn"
        class="secondary">

        PASS

      </button>

    </div>

  </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   TRANSPORTER7 FRONT-END
========================================================= */

let ws = null;

let myUserId = null;

let myRole = null;

let currentRide = null;

let offerRideId = null;

let offerActive = false;

let offerTimer = null;

let offerSecondsLeft = 20;

let audioContext = null;

let alarmTimer = null;

let geoWatch = null;


/*
 * Driver states:
 *
 * available
 * accepted
 * going_to_pickup
 * arrived
 * started
 * completed
 */

let driverRideStateValue =
  'available';


/* =========================================================
   ELEMENT HELPER
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   SHOW / HIDE
========================================================= */

function show(id){

  $(id).classList.remove(
    'hidden'
  );

}


function hide(id){

  $(id).classList.add(
    'hidden'
  );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  id,
  text,
  type=''
){

  const el = $(id);

  el.textContent = text;

  el.className =
    'status ' + type;

}


/* =========================================================
   TOAST
========================================================= */

function toast(text){

  const el =
    $('toast');

  el.textContent =
    text;

  el.classList.add(
    'show'
  );

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      ()=>{
        el.classList.remove(
          'show'
        );
      },
      2500
    );

}


/* =========================================================
   AUDIO
========================================================= */

async function unlockAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext.state ===
      'suspended'
    ){

      await audioContext.resume();

    }


    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    gain.gain.value =
      0.0001;

    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );

    osc.start();

    setTimeout(
      ()=>{
        try{
          osc.stop();
        }catch(e){}
      },
      80
    );

  }catch(e){

    console.log(
      'Audio unlock failed',
      e
    );

  }

}


function playTone(){

  if(!audioContext){
    return;
  }

  try{

    if(
      audioContext.state ===
      'suspended'
    ){

      audioContext.resume();

    }

    const now =
      audioContext.currentTime;

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.type =
      'sine';

    osc.frequency.setValueAtTime(
      880,
      now
    );

    osc.frequency.setValueAtTime(
      660,
      now + .16
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .32,
      now + .025
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .38
    );

    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );

    osc.start(now);

    osc.stop(
      now + .4
    );

  }catch(e){

    console.log(
      'Tone error',
      e
    );

  }

}


function startRideSound(){

  stopRideSound();

  playTone();

  alarmTimer =
    setInterval(
      ()=>{

        if(offerActive){

          playTone();

          if(
            navigator.vibrate
          ){

            try{

              navigator.vibrate(
                [300,120,300]
              );

            }catch(e){}

          }

        }

      },
      1100
    );

}


function stopRideSound(){

  clearInterval(
    alarmTimer
  );

  alarmTimer = null;

  if(
    navigator.vibrate
  ){

    try{

      navigator.vibrate(
        0
      );

    }catch(e){}

  }

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connect(){

  const protocol =
    location.protocol ===
    'https:'
      ? 'wss:'
      : 'ws:';

  ws =
    new WebSocket(
      protocol +
      '//' +
      location.host
    );


  ws.addEventListener(
    'open',
    ()=>{

      setStatus(
        'connectionStatus',
        'Connected',
        'good'
      );

      toast(
        'Connected'
      );

    }
  );


  ws.addEventListener(
    'close',
    ()=>{

      setStatus(
        'connectionStatus',
        'Disconnected — reconnecting...',
        'bad'
      );

      myUserId = null;

      setTimeout(
        connect,
        1500
      );

    }
  );


  ws.addEventListener(
    'error',
    ()=>{

      setStatus(
        'connectionStatus',
        'Connection error',
        'bad'
      );

    }
  );


  ws.addEventListener(
    'message',
    event=>{

      let m;

      try{

        m =
          JSON.parse(
            event.data
          );

      }catch(e){

        return;

      }

      handleMessage(m);

    }
  );

}


/* =========================================================
   SEND
========================================================= */

function send(message){

  if(
    ws &&
    ws.readyState ===
    WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify(
        message
      )
    );

    return true;

  }

  toast(
    'Not connected'
  );

  return false;

}


/* =========================================================
   START ROLE
========================================================= */

function startRole(role){

  unlockAudio();

  myRole =
    role;


  const name =
    role === 'driver'
      ? (
          $('driverName')
          .value
          .trim() ||
          'Test Driver'
        )
      : (
          $('passengerName')
          .value
          .trim() ||
          'Test Passenger'
        );


  send({

    type:'hello',

    role:role,

    name:name

  });


  send({

    type:'profile',

    name:name

  });


  if(
    role === 'driver'
  ){

    show(
      'driverSection'
    );

    hide(
      'homeSection'
    );


    driverRideStateValue =
      'available';


    send({

      type:'driver_status',

      online:true

    });


    setStatus(
      'driverStatus',
      'Driver is ONLINE and available.',
      'good'
    );


  }else{

    show(
      'passengerSection'
    );

    hide(
      'homeSection'
    );


    setStatus(
      'passengerStatus',
      'Ready to request a ride.'
    );

  }


  startLocationTracking();

}


/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleMessage(m){

  switch(m.type){

    case 'hello_ok':

      myUserId =
        m.userId;

      break;


    /* =====================================================
       NEW RIDE OFFER
    ==================================================== */

    case 'ride_call':

      if(
        myRole ===
        'driver'
      ){

        showRideOffer(
          m
        );

      }

      break;


    case 'ride_timeout':

      if(
        myRole ===
        'driver' &&
        offerRideId ===
        m.rideId
      ){

        closeRideOffer(
          'Ride offer timed out'
        );

      }

      break;


    case 'offer_passed':

      if(
        myRole ===
        'driver' &&
        offerRideId ===
        m.rideId
      ){

        closeRideOffer(
          'Ride passed'
        );

      }

      break;


    /* =====================================================
       ACCEPTED
    ==================================================== */

    case 'accepted':

      if(
        myRole ===
        'driver'
      ){

        closeRideOffer(
          'Ride accepted'
        );

        currentRide =
          m.ride;

        driverRideStateValue =
          'accepted';

        renderDriverRide();


        setStatus(
          'driverStatus',
          'RIDE ACCEPTED — Ready to go to pickup.',
          'good'
        );


        toast(
          'Ride accepted'
        );

      }

      break;


    case 'ride_lost':

      if(
        myRole ===
        'driver'
      ){

        closeRideOffer(
          'Ride was already taken'
        );

        toast(
          'Ride was taken by another driver'
        );

      }

      break;


    case 'ride_taken':

      if(
        myRole ===
        'driver' &&
        offerRideId ===
        m.rideId &&
        offerActive
      ){

        closeRideOffer(
          'Ride taken by another driver'
        );

      }

      break;


    /* =====================================================
       PASSENGER SEARCHING
    ==================================================== */

    case 'searching':

      if(
        myRole ===
        'passenger'
      ){

        currentRide = {
          id:m.rideId
        };

        setStatus(
          'passengerStatus',
          'Searching for a driver...',
          'warn'
        );

      }

      break;


    /* =====================================================
       MATCHED
    ==================================================== */

    case 'matched':

      if(
        myRole ===
        'passenger'
      ){

        currentRide =
          m.ride;

        renderPassengerRide();


        setStatus(
          'passengerStatus',
          'Driver found! Ride accepted.',
          'good'
        );


        toast(
          'Driver accepted your ride'
        );

      }

      break;


    /* =====================================================
       NO DRIVER
    ==================================================== */

    case 'no_driver':

      if(
        myRole ===
        'passenger'
      ){

        currentRide =
          null;

        hide(
          'passengerRidePanel'
        );

        setStatus(
          'passengerStatus',
          'No available driver found.',
          'bad'
        );

      }

      break;


    /* =====================================================
       RIDE STATE
    ==================================================== */

    case 'ride_state':

      if(
        m.ride
      ){

        currentRide =
          m.ride;

      }


      if(
        myRole ===
        'driver'
      ){

        applyDriverState(
          m.state
        );

        renderDriverRide();

      }


      if(
        myRole ===
        'passenger'
      ){

        renderPassengerRide();

        setStatus(
          'passengerStatus',
          passengerStateText(
            m.state
          ),
          'good'
        );

      }


      if(
        m.state ===
        'completed'
      ){

        /*
         * IMPORTANT:
         *
         * Completing a ride does NOT
         * send driver offline.
         *
         * Driver stays available.
         */

        if(
          myRole ===
          'driver'
        ){

          currentRide =
            null;

          driverRideStateValue =
            'available';

          hide(
            'driverRidePanel'
          );


          /*
           * Explicitly tell the server
           * the driver remains online.
           */

          send({

            type:'driver_status',

            online:true

          });


          setStatus(
            'driverStatus',
            'Ride complete. Driver is available again.',
            'good'
          );


          toast(
            'Ride completed — waiting for next ride'
          );

        }


        if(
          myRole ===
          'passenger'
        ){

          currentRide =
            null;

          hide(
            'passengerRidePanel'
          );

          setStatus(
            'passengerStatus',
            'Ride completed.',
            'good'
          );

        }

      }

      break;


    /* =====================================================
       CANCELLED
    ==================================================== */

    case 'cancelled':

      currentRide =
        null;


      if(
        myRole ===
        'driver'
      ){

        hide(
          'driverRidePanel'
        );

        driverRideStateValue =
          'available';


        /*
         * Driver remains online.
         */

        send({

          type:'driver_status',

          online:true

        });


        setStatus(
          'driverStatus',
          'Ride cancelled. Driver available again.',
          'warn'
        );

      }


      if(
        myRole ===
        'passenger'
      ){

        hide(
          'passengerRidePanel'
        );

        setStatus(
          'passengerStatus',
          'Ride cancelled.'
        );

      }

      break;


    case 'ride_cancelled':

      if(
        myRole ===
        'driver' &&
        offerRideId ===
        m.rideId
      ){

        closeRideOffer(
          'Ride cancelled'
        );

      }

      break;

  }

}


/* =========================================================
   APPLY DRIVER STATE
========================================================= */

function applyDriverState(state){

  switch(state){

    case 'going_to_pickup':

      driverRideStateValue =
        'going_to_pickup';

      setStatus(
        'driverStatus',
        'GOING TO PICK UP — Navigation opened.',
        'good'
      );

      break;


    case 'arrived':

      driverRideStateValue =
        'arrived';

      setStatus(
        'driverStatus',
        'ARRIVED — Passenger pickup confirmed.',
        'good'
      );

      break;


    case 'started':

      driverRideStateValue =
        'started';

      setStatus(
        'driverStatus',
        'RIDE STARTED — Passenger is onboard.',
        'good'
      );

      break;


    case 'picked_up':

      /*
       * Compatibility with old server.
       */

      driverRideStateValue =
        'started';

      setStatus(
        'driverStatus',
        'RIDE STARTED — Passenger is onboard.',
        'good'
      );

      break;


    case 'completed':

      driverRideStateValue =
        'available';

      break;

  }

}


/* =========================================================
   PASSENGER STATE TEXT
========================================================= */

function passengerStateText(state){

  switch(state){

    case 'going_to_pickup':
      return 'Driver is going to pick up the passenger.';

    case 'arrived':
      return 'Driver has arrived at pickup.';

    case 'started':
      return 'Ride started — passenger is onboard.';

    case 'picked_up':
      return 'Ride started — passenger is onboard.';

    case 'completed':
      return 'Ride completed.';

    default:
      return 'Ride status: ' + state;

  }

}


/* =========================================================
   SHOW RIDE OFFER
========================================================= */

function showRideOffer(m){

  if(
    !m.ride
  ){

    return;

  }


  if(
    offerActive &&
    offerRideId ===
    m.ride.id
  ){

    return;

  }


  currentRide =
    m.ride;

  offerRideId =
    m.ride.id;

  offerActive =
    true;


  offerSecondsLeft =
    Number(
      m.callSeconds
    ) || 20;


  $('offerPassenger')
    .textContent =
      m.ride.passengerName ||
      'Passenger';


  $('offerPickup')
    .textContent =
      m.ride.pickup ||
      '-';


  $('offerDestination')
    .textContent =
      m.ride.destination ||
      '-';


  $('offerPax')
    .textContent =
      m.ride.pax ||
      1;


  $('offerFare')
    .textContent =
      Number(
        m.ride.fare ||
        0
      ).toFixed(2);


  $('offerDistance')
    .textContent =
      m.nearbyKm == null
        ? '-'
        : Number(
            m.nearbyKm
          ).toFixed(2) +
          ' km';


  $('callCountdown')
    .textContent =
      offerSecondsLeft;


  show(
    'rideModal'
  );


  startRideSound();

  startOfferCountdown();


  if(
    navigator.vibrate
  ){

    try{

      navigator.vibrate(
        [
          500,
          150,
          500,
          150,
          500
        ]
      );

    }catch(e){}

  }

}


/* =========================================================
   OFFER COUNTDOWN
========================================================= */

function startOfferCountdown(){

  clearInterval(
    offerTimer
  );


  offerTimer =
    setInterval(
      ()=>{

        if(
          !offerActive
        ){

          clearInterval(
            offerTimer
          );

          offerTimer =
            null;

          return;

        }


        offerSecondsLeft--;


        $('callCountdown')
          .textContent =
          Math.max(
            0,
            offerSecondsLeft
          );


        if(
          offerSecondsLeft <=
          0
        ){

          clearInterval(
            offerTimer
          );

          offerTimer =
            null;

          timeoutCurrentOffer();

        }

      },
      1000
    );

}


/* =========================================================
   TAKE RIDE
========================================================= */

function takeRide(){

  if(
    !offerActive ||
    !offerRideId
  ){

    return;

  }


  const rideId =
    offerRideId;


  offerActive =
    false;


  stopRideSound();


  clearInterval(
    offerTimer
  );

  offerTimer =
    null;


  $('takeRideBtn')
    .disabled =
    true;

  $('passRideBtn')
    .disabled =
    true;


  const sent =
    send({

      type:'driver_accept',

      rideId:rideId

    });


  if(
    !sent
  ){

    $('takeRideBtn')
      .disabled =
      false;

    $('passRideBtn')
      .disabled =
      false;

    offerActive =
      true;

    startRideSound();

    return;

  }


  hide(
    'rideModal'
  );


  offerRideId =
    null;


  setStatus(
    'driverStatus',
    'Accepting ride...',
    'good'
  );

}


/* =========================================================
   PASS RIDE
========================================================= */

function passRide(){

  if(
    !offerActive ||
    !offerRideId
  ){

    return;

  }


  const rideId =
    offerRideId;


  offerActive =
    false;


  stopRideSound();


  clearInterval(
    offerTimer
  );

    .disabled =

    .disabled =

}


/* =========================================================
   OFFER TIMEOUT
========================================================= */

function timeoutCurrentOffer(){

  if(
    !offerActive ||
    !offerRideId
  ){

  }


  const rideId =
    offerRideId;


  offerActive =
    false;


  stopRideSound();


  clearInterval(
    offerTimer
  );

  offerTimer =
    null;


  send({

    type:'driver_timeout',

    rideId:rideId

  });


  hide(
    'rideModal'
  );

  setStatus(

}


/* =========================================================

========================================================= */

function closeRideOffer(reason){

    'rideModal'

    );

/* =========================================================
   DRIVER ACTION BUTTON
========================================================= */

function updateDriverRideButton(){

  const btn =
    $('driverRideActionBtn');


  if(
    !currentRide
  ){

    btn.disabled =
      true;

    btn.textContent =
      'GO PICK UP';

    return;

  }


  btn.disabled =
    false;


  switch(
    driverRideStateValue
  ){

    case 'accepted':

      btn.textContent =
        'GO PICK UP — ' +
        (
          currentRide.passengerName ||
          'Passenger'
        );

      btn.className =
        'primary';

      break;


    case 'going_to_pickup':

      btn.textContent =
        'ARRIVED';

      btn.className =
        'primary';

      break;


    case 'arrived':

      btn.textContent =
        'START RIDE';

      btn.className =
        'primary';

      break;


    case 'started':

      btn.textContent =
        'DROP OFF — ' +
        (
          currentRide.passengerName ||
          'Passenger'
        );

      btn.className =
        'success';

      break;


    default:

      btn.textContent =
        'GO PICK UP';

      btn.className =
        'primary';

      break;

  }

}


/* =========================================================
   DRIVER RIDE ACTION
========================================================= */

function driverRideAction(){

  if(
    !currentRide
  ){

    return;

  }


  switch(
    driverRideStateValue
  ){

    /* =====================================================
       GO PICK UP
    ==================================================== */

    case 'accepted':

      openNavigation(
        currentRide.pickupCoords,
        currentRide.pickup
      );


      send({

        type:'ride_state',

        rideId:
          currentRide.id,

        state:
          'going_to_pickup'

      });


      driverRideStateValue =
        'going_to_pickup';


      setStatus(
        'driverStatus',
        'GOING TO PICK UP — Navigation opened.',
        'good'
      );


      updateDriverRideButton();


      toast(
        'Navigation opened to pickup'
      );

      break;


    /* =====================================================
       ARRIVED
    ==================================================== */

    case 'going_to_pickup':

      send({

        type:'ride_state',

        rideId:
          currentRide.id,

        state:
          'arrived'

      });


      driverRideStateValue =
        'arrived';


      setStatus(
        'driverStatus',
        'ARRIVED — Passenger pickup confirmed.',
        'good'
      );


      updateDriverRideButton();

      break;


    /* =====================================================
       START RIDE
    ==================================================== */

    case 'arrived':

      openNavigation(
        currentRide.destinationCoords,
        currentRide.destination
      );


      send({

        type:'ride_state',

        rideId:
          currentRide.id,

        state:
          'started'

      });


      driverRideStateValue =
        'started';


      setStatus(
        'driverStatus',
        'RIDE STARTED — Passenger is onboard.',
        'good'
      );


      updateDriverRideButton();


      toast(
        'Navigation opened to destination'
      );

      break;


    /* =====================================================
       DROP OFF
    ==================================================== */

    case 'started':

      send({

        type:'ride_state',

        rideId:
          currentRide.id,

        state:
          'completed'

      });


      /*
       * Stay online.
       *
       * We don't press GO ONLINE again.
       */

      driverRideStateValue =
        'completed';


      setStatus(
        'driverStatus',
        'Completing ride...',
        'good'
      );

      break;

  }

}

/* =========================================================
   REQUEST RIDE
========================================================= */

async function requestRide(){

  unlockAudio();


  const pickup =
    $('pickup')
      .value
      .trim();


  const destination =
    $('destination')
      .value
      .trim();


  const pax =
    Number(
      $('pax').value
    ) || 1;


  const fare =
    Number(
      $('fare').value
    ) || 0;


  if(
    pickup.length <
    3
  ){

    setStatus(
      'passengerStatus',
      'Please enter a pickup address.',
      'bad'
    );

    return;

  }


  if(
    destination.length <
    3
  ){

    setStatus(
      'passengerStatus',
      'Please enter a destination.',
      'bad'
    );

    return;

  }


  setStatus(
    'passengerStatus',
    'Finding pickup and destination...',
    'warn'
  );


  /*
   * Geocode BOTH addresses.
   */

  const pickupCoords =
    await geocodeOne(
      pickup
    );


  const destinationCoords =
    await geocodeOne(
      destination
    );


  const ride = {

    pickup:pickup,

    destination:destination,

    pax:pax,

    fare:fare,

    pickupCoords:
      pickupCoords,

    destinationCoords:
      destinationCoords

  };


  const sent =
    send({

      type:'passenger_offer',

      ride:ride

    });


  if(
    sent
  ){

    currentRide =
      {
        ...ride
      };


    renderPassengerRide();


    setStatus(
      'passengerStatus',
      'Searching for a driver...',
      'warn'
    );

  }

}

========================================================= */

  if(
    !currentRide ||
    !currentRide.id
  ){

  send({

    type:'cancel_ride',

    rideId:
      currentRide.id

  currentRide =

  );


  setStatus(
    'passengerStatus',

  );

}


/* =========================================================
   DRIVER CANCEL
========================================================= */

function cancelDriverRide(){

  if(
    !currentRide ||
    !currentRide.id
  ){

    return;

  }


  send({

    type:'cancel_ride',

    rideId:
      currentRide.id

  });


  currentRide =
    null;


  driverRideStateValue =
    'available';


  hide(
    'driverRidePanel'
  );


  /*
   * DRIVER REMAINS ONLINE.
   */

  send({

    type:'driver_status',

    online:true

  });


  setStatus(
    'driverStatus',
    'Ride cancelled. Driver available again.',
    'warn'
  );

}


/* =========================================================
   GOOGLE MAPS NAVIGATION
========================================================= */

function openNavigation(
  coords,
  address
){

  let url;


  /*
   * Prefer exact coordinates.
   */

  if(
    coords &&
    coords.lat != null &&
    coords.lng != null
  ){

    const lat =
      Number(
        coords.lat
      );

    const lng =
      Number(
        coords.lng
      );


    if(
      Number.isFinite(lat) &&
      Number.isFinite(lng)
    ){

      url =
        'https://www.google.com/maps/dir/?api=1' +
        '&destination=' +
        encodeURIComponent(
          lat + ',' + lng
        ) +
        '&travelmode=driving';

    }

  }


  /*
   * Address fallback.
   */

  if(
    !url
  ){

    url =
      'https://www.google.com/maps/dir/?api=1' +
      '&destination=' +
      encodeURIComponent(
        address || ''
      ) +
      '&travelmode=driving';

  }


  /*
   * Open Maps.
   */

  const newWindow =
    window.open(
      url,
      '_blank'
    );


  /*
   * Popup-blocker fallback.
   */

  if(
    !newWindow
  ){

    window.location.href =
      url;

  }

}


/* =========================================================
   GEOLOCATION
========================================================= */

function startLocationTracking(){

  if(
    !navigator.geolocation
  ){

    return;

  }


  if(
    geoWatch !== null
  ){

    return;

  }


  geoWatch =
    navigator.geolocation.watchPosition(

      position=>{

        send({

          type:'location',

          lat:
            position.coords.latitude,

          lng:
            position.coords.longitude

        });

      },

      error=>{

        console.log(
          'Location unavailable',
          error.message
        );

      },

      {

        enableHighAccuracy:true,

        maximumAge:5000,

        timeout:10000

      }

    );

}


/* =========================================================
   ADDRESS GEOCODING
========================================================= */

async function geocodeOne(q){

  try{

    const response =
      await fetch(
        '/api/address?q=' +
        encodeURIComponent(
          q
        )
      );


    if(
      !response.ok
    ){

      return null;

    }


    const results =
      await response.json();


    if(
      !Array.isArray(
        results
      ) ||
      results.length === 0
    ){

      return null;

    }


    return {

      lat:
        Number(
          results[0].lat
        ),

      lng:
        Number(
          results[0].lon
        )

    };

  }catch(e){

    console.log(
      'Address lookup failed',
      e
    );

    return null;

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ''
  )
  .replaceAll(
    '&',
    '&amp;'
  )
  .replaceAll(
    '<',
    '&lt;'
  )
  .replaceAll(
    '>',
    '&gt;'
  )
  .replaceAll(
    '"',
    '&quot;'
  )
  .replaceAll(
    "'",
    '&#039;'
  );

}
