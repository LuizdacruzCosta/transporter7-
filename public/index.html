<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transporter7</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

body{
  min-height:100vh;
}

header{
  background:#07101f;
  color:white;
  padding:24px 18px;
}

header h1{
  margin:0 0 8px;
  font-size:30px;
}

header p{
  margin:0;
  color:#9ca3af;
}

main{
  max-width:1000px;
  margin:0 auto;
  padding:24px 16px 60px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.primary{
  background:#173b82;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.big{
  width:100%;
  min-height:58px;
  font-size:20px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
}

.muted{
  color:#6b7280;
}

.status{
  padding:12px 14px;
  border-radius:10px;
  background:#eef2ff;
  margin:12px 0;
  font-weight:bold;
}

.status.good{
  background:#dcfce7;
  color:#166534;
}

.status.warn{
  background:#fef3c7;
  color:#92400e;
}

.status.bad{
  background:#fee2e2;
  color:#991b1b;
}

.hidden{
  display:none!important;
}

.small{
  font-size:14px;
}

.center{
  text-align:center;
}


/* =========================================================
   RIDE OFFER OVERLAY
========================================================= */

#rideModal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.70);
  padding:18px;
}

#rideModal.hidden{
  display:none!important;
}

.callBox{
  width:min(540px,100%);
  background:white;
  border-radius:26px;
  padding:26px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
  animation:callIn .18s ease-out;
}

@keyframes callIn{
  from{
    transform:scale(.92);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.phoneIcon{
  font-size:60px;
  text-align:center;
  margin-bottom:4px;
  animation:ring .8s infinite alternate;
}

@keyframes ring{
  from{
    transform:rotate(-8deg);
  }

  to{
    transform:rotate(8deg);
  }
}

.callTitle{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:8px 0 4px;
}

.callSub{
  text-align:center;
  color:#6b7280;
  margin-bottom:16px;
}

.countdown{
  text-align:center;
  font-size:58px;
  font-weight:900;
  line-height:1;
  margin:15px 0 22px;
}

.offerInfo{
  background:#f3f4f6;
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
}

.offerInfo div{
  margin:7px 0;
}

.callButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.callButtons button{
  min-height:64px;
  font-size:20px;
}


/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  z-index:100000;
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
  display:none;
}

#toast.show{
  display:block;
}


@media(max-width:600px){

  .callBox{
    padding:20px;
  }

  .callTitle{
    font-size:25px;
  }

  .countdown{
    font-size:52px;
  }

  .callButtons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Transporter7</h1>
  <p>Multi-driver • Multi-passenger • Real-time</p>
</header>

<main>


<!-- =======================================================
     HOME / APP SELECTION
======================================================= -->

<section id="homeSection" class="card">

  <h2>Choose App</h2>

  <div class="grid">

    <button id="driverAppBtn"
            class="primary big">
      🚗 DRIVER APP
    </button>

    <button id="passengerAppBtn"
            class="primary big">
      👤 PASSENGER APP
    </button>

  </div>

  <p id="connectionStatus"
     class="status warn">
    Connecting...
  </p>

</section>



<!-- =======================================================
     DRIVER APP
======================================================= -->

<section id="driverSection"
         class="hidden">

  <div class="card">

    <h2>Driver Home</h2>

    <label>Driver Name</label>

    <input id="driverName"
           value="Test Driver">

    <div class="row"
         style="margin-top:14px">

      <button id="driverOnlineBtn"
              class="success">
        GO ONLINE
      </button>

      <button id="driverOfflineBtn"
              class="secondary">
        GO OFFLINE
      </button>

    </div>

    <div id="driverStatus"
         class="status">
      Driver is starting...
    </div>



    <!-- ===============================================
         CURRENT DRIVER RIDE
    ================================================ -->

    <div id="driverRidePanel"
         class="card hidden">

      <h3>Current Ride</h3>

      <div id="driverRideInfo"></div>


      <!--
        IMPORTANT DRIVER FLOW

        ACCEPTED
           ↓
        GO PICK UP — Passenger
           ↓
        ARRIVED
           ↓
        START RIDE
           ↓
        DROP OFF — Passenger
      -->

      <div class="row">

        <button id="driverArrivedBtn"
                class="primary hidden">
          GO PICK UP
        </button>

        <button id="driverStartBtn"
                class="primary hidden">
          START RIDE
        </button>

        <button id="driverCompleteBtn"
                class="success hidden">
          DROP OFF
        </button>

      </div>


      <button id="driverCancelBtn"
              class="danger big"
              style="margin-top:12px">
        CANCEL RIDE
      </button>

    </div>


    <button id="backFromDriverBtn"
            class="secondary big"
            style="margin-top:16px">
      BACK
    </button>

  </div>

</section>



<!-- =======================================================
     PASSENGER APP
======================================================= -->

<section id="passengerSection"
         class="hidden">

  <div class="card">

    <h2>Request a Ride</h2>

    <label>Passenger Name</label>

    <input id="passengerName"
           value="Test Passenger">


    <label>Pickup</label>

    <input id="pickup"
           placeholder="Start typing pickup address..."
           autocomplete="off">


    <label>Destination</label>

    <input id="destination"
           placeholder="Start typing destination address..."
           autocomplete="off">


    <label>Passengers</label>

    <input id="pax"
           type="number"
           min="1"
           value="1">


    <label>Fare / Offer</label>

    <input id="fare"
           type="number"
           min="0"
           step=".01"
           value="20">


    <button id="requestRideBtn"
            class="primary big"
            style="margin-top:18px">
      REQUEST RIDE
    </button>


    <div id="passengerStatus"
         class="status">
      Ready.
    </div>


    <!-- PASSENGER CURRENT RIDE -->

    <div id="passengerRidePanel"
         class="card hidden">

      <h3>Current Ride</h3>

      <div id="passengerRideInfo"></div>

      <button id="passengerCancelBtn"
              class="danger big"
              style="margin-top:14px">
        CANCEL RIDE
      </button>

    </div>


    <button id="backFromPassengerBtn"
            class="secondary big"
            style="margin-top:16px">
      BACK
    </button>

  </div>

</section>



<!-- =======================================================
     INCOMING DRIVER RIDE OFFER
======================================================= -->

<div id="rideModal"
     class="hidden">

  <div class="callBox">

    <div class="phoneIcon">
      📞
    </div>

    <div class="callTitle">
      NEW RIDE OFFER
    </div>

    <div class="callSub">
      Incoming passenger request
    </div>

    <div id="callCountdown"
         class="countdown">
      20
    </div>


    <div class="offerInfo">

      <div>
        <b>Passenger:</b>
        <span id="offerPassenger">-</span>
      </div>

      <div>
        <b>Pickup:</b>
        <span id="offerPickup">-</span>
      </div>

      <div>
        <b>Destination:</b>
        <span id="offerDestination">-</span>
      </div>

      <div>
        <b>Passengers:</b>
        <span id="offerPax">-</span>
      </div>

      <div>
        <b>Fare:</b>
        $<span id="offerFare">0</span>
      </div>

      <div>
        <b>Distance:</b>
        <span id="offerDistance">-</span>
      </div>

    </div>


    <div class="callButtons">

      <button id="takeRideBtn"
              class="success">
        TAKE IT
      </button>

      <button id="passRideBtn"
              class="secondary">
        PASS
      </button>

    </div>

  </div>

</div>



<div id="toast"></div>



<script>

/* =========================================================
   TRANSPORTER7 FRONT-END
   Uses the EXISTING server.js state machine.

   DRIVER RIDE STATES:

   accepted
       ↓
   going_to_pickup
       ↓
   arrived
       ↓
   started
       ↓
   completed
========================================================= */


let ws = null;

let myUserId = null;

let myRole = null;

let currentRide = null;

let offerRideId = null;

let offerActive = false;

let offerTimer = null;

let offerSecondsLeft = 20;

let audioContext = null;

let alarmTimer = null;

let geoWatch = null;



/* =========================================================
   ELEMENT HELPER
========================================================= */

const $ = id => document.getElementById(id);


function show(id){

  const el = $(id);

  if(el){
    el.classList.remove('hidden');
  }
}


function hide(id){

  const el = $(id);

  if(el){
    el.classList.add('hidden');
  }
}


function setStatus(id,text,type=''){

  const el = $(id);

  if(!el){
    return;
  }

  el.textContent = text;

  el.className =
    'status ' + type;
}


function toast(text){

  const el = $('toast');

  if(!el){
    return;
  }

  el.textContent = text;

  el.classList.add('show');

  clearTimeout(toast.timer);

  toast.timer =
    setTimeout(()=>{
      el.classList.remove('show');
    },2500);
}



/* =========================================================
   AUDIO
========================================================= */

async function unlockAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioContext.state === 'suspended'){

      await audioContext.resume();

    }


    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    gain.gain.value = 0.0001;

    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );

    osc.start();

    setTimeout(()=>{

      try{
        osc.stop();
      }catch(e){}

    },80);

  }catch(e){

    console.log(
      'Audio unlock failed',
      e
    );

  }
}


function playTone(){

  if(!audioContext){
    return;
  }

  try{

    if(audioContext.state === 'suspended'){
      audioContext.resume();
    }

    const now =
      audioContext.currentTime;


    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    osc.type = 'sine';

    osc.frequency.setValueAtTime(
      880,
      now
    );

    osc.frequency.setValueAtTime(
      660,
      now + .16
    );


    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .32,
      now + .025
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .38
    );


    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );


    osc.start(now);

    osc.stop(now + .4);

  }catch(e){

    console.log(
      'Tone error',
      e
    );

  }
}


function startRideSound(){

  stopRideSound();

  playTone();

  alarmTimer =
    setInterval(()=>{

      if(offerActive){

        playTone();

        if(navigator.vibrate){

          try{

            navigator.vibrate([
              300,
              120,
              300
            ]);

          }catch(e){}

        }

      }

    },1100);
}


function stopRideSound(){

  clearInterval(alarmTimer);

  alarmTimer = null;

  if(navigator.vibrate){

    try{
      navigator.vibrate(0);
    }catch(e){}

  }

}



/* =========================================================
   WEBSOCKET CONNECTION
========================================================= */

function connect(){

  const protocol =
    location.protocol === 'https:'
      ? 'wss:'
      : 'ws:';


  ws =
    new WebSocket(
      protocol +
      '//' +
      location.host
    );


  ws.addEventListener(
    'open',
    ()=>{

      setStatus(
        'connectionStatus',
        'Connected',
        'good'
      );

      toast('Connected');

    }
  );


  ws.addEventListener(
    'close',
    ()=>{

      setStatus(
        'connectionStatus',
        'Disconnected — reconnecting...',
        'bad'
      );

      myUserId = null;

      setTimeout(
        connect,
        1500
      );

    }
  );


  ws.addEventListener(
    'error',
    ()=>{

      setStatus(
        'connectionStatus',
        'Connection error',
        'bad'
      );

    }
  );


  ws.addEventListener(
    'message',
    event=>{

      let m;

      try{

        m =
          JSON.parse(
            event.data
          );

      }catch(e){

        return;

      }

      handleMessage(m);

    }
  );
}



function send(message){

  if(
    ws &&
    ws.readyState ===
      WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify(message)
    );

    return true;
  }


  toast('Not connected');

  return false;
}



/* =========================================================
   START DRIVER OR PASSENGER
========================================================= */

function startRole(role){

  unlockAudio();

  myRole = role;


  const name =
    role === 'driver'
      ? (
          $('driverName')
            .value
            .trim()
          ||
          'Test Driver'
        )
      : (
          $('passengerName')
            .value
            .trim()
          ||
          'Test Passenger'
        );


  /*
   * HELLO MUST COME FIRST.
   * WebSocket preserves message order.
   */

  send({
    type:'hello',
    role,
    name
  });


  send({
    type:'profile',
    name
  });


  if(role === 'driver'){

    show('driverSection');

    hide('homeSection');


    setStatus(
      'driverStatus',
      'Driver online and available.',
      'good'
    );


    send({
      type:'driver_status',
      online:true
    });


  }else{

    show('passengerSection');

    hide('homeSection');


    setStatus(
      'passengerStatus',
      'Ready to request a ride.'
    );

  }


  startLocationTracking();
}



/* =========================================================
   SERVER MESSAGE HANDLING
========================================================= */

function handleMessage(m){

  switch(m.type){


    /* =====================================================
       HELLO
    ===================================================== */

    case 'hello_ok':

      myUserId =
        m.userId;

      break;



    /* =====================================================
       DRIVER RECEIVES RIDE OFFER
    ===================================================== */

    case 'ride_call':

      if(myRole === 'driver'){

        showRideOffer(m);

      }

      break;



    /* =====================================================
       OFFER TIMEOUT
    ===================================================== */

    case 'ride_timeout':

      if(myRole === 'driver'){

        if(
          offerRideId ===
          m.rideId
        ){

          closeRideOffer(
            'Ride offer timed out'
          );

        }

      }

      break;



    /* =====================================================
       DRIVER PASSED
    ===================================================== */

    case 'offer_passed':

      if(myRole === 'driver'){

        if(
          offerRideId ===
          m.rideId
        ){

          closeRideOffer(
            'Ride passed'
          );

        }

      }

      break;



    /* =====================================================
       DRIVER ACCEPTED RIDE
    ===================================================== */

    case 'accepted':

      if(myRole === 'driver'){

        closeRideOffer(
          'Ride accepted'
        );


        currentRide =
          m.ride;


        show(
          'driverRidePanel'
        );


        renderDriverRide();


        setStatus(
          'driverStatus',
          'RIDE ACCEPTED',
          'good'
        );


        toast(
          'Ride accepted'
        );

      }

      break;



    /* =====================================================
       RIDE LOST
    ===================================================== */

    case 'ride_lost':

      if(myRole === 'driver'){

        closeRideOffer(
          'Ride was already taken'
        );


        toast(
          'Ride was taken by another driver'
        );

      }

      break;



    /* =====================================================
       ANOTHER DRIVER TOOK RIDE
    ===================================================== */

    case 'ride_taken':

      if(myRole === 'driver'){

        if(
          offerRideId ===
          m.rideId &&
          offerActive
        ){

          closeRideOffer(
            'Ride taken by another driver'
          );

        }

      }

      break;



    /* =====================================================
       PASSENGER SEARCHING
    ===================================================== */

    case 'searching':

      if(myRole === 'passenger'){

        setStatus(
          'passengerStatus',
          'Searching for a driver...',
          'warn'
        );


        currentRide = {
          id:m.rideId
        };

      }

      break;



    /* =====================================================
       PASSENGER MATCHED
    ===================================================== */

    case 'matched':

      if(myRole === 'passenger'){

        currentRide =
          m.ride;


        show(
          'passengerRidePanel'
        );


        renderPassengerRide();


        setStatus(
          'passengerStatus',
          'Driver found! Ride accepted.',
          'good'
        );


        toast(
          'Driver accepted your ride'
        );

      }

      break;



    /* =====================================================
       NO DRIVER
    ===================================================== */

    case 'no_driver':

      if(myRole === 'passenger'){

        setStatus(
          'passengerStatus',
          'No available driver found.',
          'bad'
        );


        currentRide = null;

        hide(
          'passengerRidePanel'
        );

      }

      break;



    /* =====================================================
       RIDE STATE CHANGE
    ===================================================== */

    case 'ride_state':

      if(m.ride){

        currentRide =
          m.ride;

      }


      if(myRole === 'driver'){

        renderDriverRide();


        const state =
          m.state;


        const driverMessages = {

          accepted:
            'RIDE ACCEPTED — Ready to go.',

          going_to_pickup:
            'GOING TO PICK UP — ' +
            (
              currentRide?.passengerName ||
              'Passenger'
            ),

          arrived:
            'ARRIVED — Passenger pickup confirmed.',

          started:
            'RIDE STARTED — Passenger is onboard.',

          completed:
            'DROP OFF COMPLETE — Ride finished.',

          cancelled:
            'Ride cancelled.'
        };


        setStatus(
          'driverStatus',
          driverMessages[state] ||
          'Ride status: ' + state,
          state === 'cancelled'
            ? 'warn'
            : 'good'
        );


        /*
         * Once completed, clear the driver's ride
         * and return to available status.
         */

        if(state === 'completed'){

          currentRide = null;

          hide(
            'driverRidePanel'
          );

          setStatus(
            'driverStatus',
            'Ride complete. Driver is available again.',
            'good'
          );

        }

      }



      if(myRole === 'passenger'){

        renderPassengerRide();


        const passengerMessages = {

          accepted:
            'Driver accepted your ride.',

          going_to_pickup:
            'Driver is on the way to pick you up.',

          arrived:
            'Your driver has arrived.',

          started:
            'Your ride has started.',

          completed:
            'You have arrived. Ride complete.',

          cancelled:
            'Ride cancelled.'
        };


        setStatus(
          'passengerStatus',
          passengerMessages[m.state] ||
          'Ride status: ' + m.state,
          m.state === 'cancelled'
            ? 'warn'
            : 'good'
        );


        if(m.state === 'completed'){

          currentRide = null;

          hide(
            'passengerRidePanel'
          );

        }

      }

      break;



    /* =====================================================
       CANCELLED
    ===================================================== */

    case 'cancelled':

      currentRide = null;


      if(myRole === 'driver'){

        hide(
          'driverRidePanel'
        );


        setStatus(
          'driverStatus',
          'Ride cancelled. Driver available again.',
          'warn'
        );

      }


      if(myRole === 'passenger'){

        hide(
          'passengerRidePanel'
        );


        setStatus(
          'passengerStatus',
          'Ride cancelled.'
        );

      }

      break;



    /* =====================================================
       RIDE CANCELLED FOR DRIVER
    ===================================================== */

    case 'ride_cancelled':

      if(
        myRole === 'driver' &&
        offerRideId ===
          m.rideId
      ){

        closeRideOffer(
          'Ride cancelled'
        );

      }

      break;



    /* =====================================================
       SERVER ERROR
    ===================================================== */

    case 'error':

      toast(
        m.message ||
        'Server error'
      );

      break;



    /* =====================================================
       STATE REJECTED
    ===================================================== */

    case 'state_rejected':

      toast(
        'Action not allowed. Current ride status: ' +
        (m.currentState || 'unknown')
      );

      /*
       * Refresh the driver's current ride
       * display without changing server state.
       */

      renderDriverRide();

      break;

  }

}



/* =========================================================
   INCOMING RIDE OFFER
========================================================= */

function showRideOffer(m){

  if(!m.ride){
    return;
  }


  /*
   * Ignore duplicate offers.
   */

  if(
    offerActive &&
    offerRideId ===
      m.ride.id
  ){

    return;
  }


  currentRide =
    m.ride;


  offerRideId =
    m.ride.id;


  offerActive =
    true;


  offerSecondsLeft =
    Number(
      m.callSeconds
    ) || 20;


  $('offerPassenger').textContent =
    m.ride.passengerName ||
    'Passenger';


  $('offerPickup').textContent =
    m.ride.pickup ||
    '-';


  $('offerDestination').textContent =
    m.ride.destination ||
    '-';


  $('offerPax').textContent =
    m.ride.pax ||
    1;


  $('offerFare').textContent =
    Number(
      m.ride.fare ||
      0
    ).toFixed(2);


  $('offerDistance').textContent =
    m.nearbyKm == null
      ? '-'
      : Number(
          m.nearbyKm
        ).toFixed(2) +
        ' km';


  $('callCountdown').textContent =
    offerSecondsLeft;


  /*
   * Reset buttons.
   */

  $('takeRideBtn').disabled =
    false;

  $('passRideBtn').disabled =
    false;


  show(
    'rideModal'
  );


  startRideSound();

  startOfferCountdown();


  if(navigator.vibrate){

    try{

      navigator.vibrate([
        500,
        150,
        500,
        150,
        500
      ]);

    }catch(e){}

  }

}



/* =========================================================
   OFFER COUNTDOWN
========================================================= */

function startOfferCountdown(){

  clearInterval(
    offerTimer
  );


  offerTimer =
    setInterval(()=>{

      if(!offerActive){

        clearInterval(
          offerTimer
        );

        offerTimer = null;

        return;

      }


      offerSecondsLeft--;


      $('callCountdown').textContent =
        Math.max(
          0,
          offerSecondsLeft
        );


      if(
        offerSecondsLeft <= 0
      ){

        clearInterval(
          offerTimer
        );

        offerTimer = null;


        timeoutCurrentOffer();

      }

    },1000);

}



/* =========================================================
   TAKE IT
========================================================= */

function takeRide(){

  if(
    !offerActive ||
    !offerRideId
  ){

    return;

  }


  const rideId =
    offerRideId;


  /*
   * Lock immediately.
   */

  offerActive =
    false;


  stopRideSound();


  clearInterval(
    offerTimer
  );

  offerTimer = null;


  $('takeRideBtn').disabled =
    true;

  $('passRideBtn').disabled =
    true;


  const sent =
    send({
      type:'driver_accept',
      rideId
    });


  if(!sent){

    $('takeRideBtn').disabled =
      false;

    $('passRideBtn').disabled =
      false;


    offerActive =
      true;


    startRideSound();

    return;

  }


  hide(
    'rideModal'
  );


  offerRideId =
    null;


  setStatus(
    'driverStatus',
    'Accepting ride...',
    'good'
  );

}



/* =========================================================
   PASS
========================================================= */

function passRide(){

  if(
    !offerActive ||
    !offerRideId
  ){

    return;

  }


  const rideId =
    offerRideId;


  offerActive =
    false;


  stopRideSound();


  clearInterval(
    offerTimer
  );

  offerTimer = null;


  $('takeRideBtn').disabled =
    true;

  $('passRideBtn').disabled =
    true;


  send({
    type:'driver_pass',
    rideId
  });


  hide(
    'rideModal'
  );


  offerRideId =
    null;


  setStatus(
    'driverStatus',
    'Ride passed. Waiting for next offer.',
    'warn'
  );

}



/* =========================================================
   OFFER TIMEOUT
========================================================= */

function timeoutCurrentOffer(){

  if(
    !offerActive ||
    !offerRideId
  ){

    return;

  }


  const rideId =
    offerRideId;


  offerActive =
    false;


  stopRideSound();


  clearInterval(
    offerTimer
  );

  offerTimer = null;


  $('takeRideBtn').disabled =
    true;

  $('passRideBtn').disabled =
    true;


  send({
    type:'driver_timeout',
    rideId
  });


  hide(
    'rideModal'
  );


  offerRideId =
    null;


  setStatus(
    'driverStatus',
    'Offer timed out. Waiting for next offer.',
    'warn'
  );

}



/* =========================================================
   CLOSE OFFER
========================================================= */

function closeRideOffer(reason){

  offerActive =
    false;


  clearInterval(
    offerTimer
  );

  offerTimer = null;


  stopRideSound();


  hide(
    'rideModal'
  );


  offerRideId =
    null;


  $('takeRideBtn').disabled =
    false;

  $('passRideBtn').disabled =
    false;


  if(reason){

    console.log(
      reason
    );

  }

}



/* =========================================================
   DRIVER CURRENT RIDE
========================================================= */

function renderDriverRide(){

  if(!currentRide){

    hide(
      'driverRidePanel'
    );

    return;

  }


  show(
    'driverRidePanel'
  );


  $('driverRideInfo').innerHTML = `

    <p>
      <b>Passenger:</b>
      ${escapeHtml(
        currentRide.passengerName ||
        '-'
      )}
    </p>

    <p>
      <b>Pickup:</b>
      ${escapeHtml(
        currentRide.pickup ||
        '-'
      )}
    </p>

    <p>
      <b>Destination:</b>
      ${escapeHtml(
        currentRide.destination ||
        '-'
      )}
    </p>

    <p>
      <b>Passengers:</b>
      ${currentRide.pax || 1}
    </p>

    <p>
      <b>Fare:</b>
      $${Number(
        currentRide.fare ||
        0
      ).toFixed(2)}
    </p>

  `;


  /*
   * Hide every action first.
   */

  hide(
    'driverArrivedBtn'
  );

  hide(
    'driverStartBtn'
  );

  hide(
    'driverCompleteBtn'
  );


  /*
   * =======================================================
   * ACCEPTED
   *
   * Driver has accepted the ride.
   *
   * Show:
   *
   * GO PICK UP — Passenger Name
   * =======================================================
   */

  if(
    currentRide.status ===
      'accepted'
  ){

    $('driverArrivedBtn').textContent =
      'GO PICK UP — ' +
      (
        currentRide.passengerName ||
        'PASSENGER'
      );


    show(
      'driverArrivedBtn'
    );

    return;
  }



  /*
   * =======================================================
   * GOING TO PICKUP
   *
   * Driver pressed GO PICK UP.
   *
   * Show:
   *
   * ARRIVED
   * =======================================================
   */

  if(
    currentRide.status ===
      'going_to_pickup'
  ){

    $('driverArrivedBtn').textContent =
      'ARRIVED';


    show(
      'driverArrivedBtn'
    );

    return;
  }



  /*
   * =======================================================
   * ARRIVED
   *
   * Driver reached passenger.
   *
   * Show:
   *
   * START RIDE
   * =======================================================
   */

  if(
    currentRide.status ===
      'arrived'
  ){

    show(
      'driverStartBtn'
    );

    return;
  }



  /*
   * =======================================================
   * STARTED
   *
   * Passenger is now onboard.
   *
   * Show:
   *
   * DROP OFF — Passenger Name
   * =======================================================
   */

  if(
    currentRide.status ===
      'started'
  ){

    $('driverCompleteBtn').textContent =
      'DROP OFF — ' +
      (
        currentRide.passengerName ||
        'PASSENGER'
      );


    show(
      'driverCompleteBtn'
    );

    return;
  }

}



/* =========================================================
   DRIVER STATE ACTION
========================================================= */

function driverRideState(state){

  if(!currentRide){

    return;

  }


  send({
    type:'ride_state',
    rideId:currentRide.id,
    state
  });

}



/* =========================================================
   PASSENGER CURRENT RIDE
========================================================= */

function renderPassengerRide(){

  if(!currentRide){

    hide(
      'passengerRidePanel'
    );

    return;

  }


  show(
    'passengerRidePanel'
  );


  let statusText =
    'Searching for driver...';


  if(currentRide.status){

    const statuses = {

      accepted:
        'Driver accepted your ride.',

      going_to_pickup:
        'Driver is going to pick you up.',

      arrived:
        'Driver has arrived.',

      started:
        'Ride is in progress.',

      completed:
        'Ride completed.',

      cancelled:
        'Ride cancelled.'

    };


    statusText =
      statuses[
        currentRide.status
      ] ||
      currentRide.status;

  }


  $('passengerRideInfo').innerHTML = `

    <p>
      <b>Status:</b>
      ${escapeHtml(statusText)}
    </p>

    <p>
      <b>Pickup:</b>
      ${escapeHtml(
        currentRide.pickup ||
        '-'
      )}
    </p>

    <p>
      <b>Destination:</b>
      ${escapeHtml(
        currentRide.destination ||
        '-'
      )}
    </p>

    <p>
      <b>Passengers:</b>
      ${currentRide.pax || 1}
    </p>

    <p>
      <b>Fare:</b>
      $${Number(
        currentRide.fare ||
        0
      ).toFixed(2)}
    </p>

    <p>
      <b>Driver:</b>
      ${escapeHtml(
        currentRide.driverName ||
        '-'
      )}
    </p>

  `;

}



/* =========================================================
   REQUEST PASSENGER RIDE
========================================================= */

async function requestRide(){

  unlockAudio();


  const pickup =
    $('pickup')
      .value
      .trim();


  const destination =
    $('destination')
      .value
      .trim();


  const pax =
    Number(
      $('pax').value
    ) || 1;


  const fare =
    Number(
      $('fare').value
    ) || 0;


  if(pickup.length < 3){

    setStatus(
      'passengerStatus',
      'Please enter a pickup address.',
      'bad'
    );

    return;

  }


  if(destination.length < 3){

    setStatus(
      'passengerStatus',
      'Please enter a destination.',
      'bad'
    );

    return;

  }


  setStatus(
    'passengerStatus',
    'Sending ride request...',
    'warn'
  );


  const pickupCoords =
    await geocodeOne(
      pickup
    );


  const ride = {

    pickup,

    destination,

    pax,

    fare,

    pickupCoords

  };


  const sent =
    send({

      type:'passenger_offer',

      ride

    });


  if(sent){

    currentRide = {

      pickup,

      destination,

      pax,

      fare,

      pickupCoords,

      status:'searching'

    };


    show(
      'passengerRidePanel'
    );


    renderPassengerRide();


    setStatus(
      'passengerStatus',
      'Searching for a driver...',
      'warn'
    );

  }

}



/* =========================================================
   PASSENGER CANCEL RIDE
========================================================= */

function cancelRide(){

  if(
    !currentRide ||
    !currentRide.id
  ){

    return;

  }


  send({

    type:'cancel_ride',

    rideId:
      currentRide.id

  });


  currentRide =
    null;


  hide(
    'passengerRidePanel'
  );


  setStatus(
    'passengerStatus',
    'Ride cancelled.'
  );

}



/* =========================================================
   DRIVER CANCEL RIDE
========================================================= */

function cancelDriverRide(){

    !currentRide ||

  }


  send({

    type:'cancel_ride',

    rideId:
      currentRide.id

  });

}



/* =========================================================
   GEOLOCATION
========================================================= */

function startLocationTracking(){

  if(
    !navigator.geolocation
  ){

    return;

  }


  if(
    geoWatch !== null
  ){

    return;

  }


  geoWatch =
    navigator.geolocation.watchPosition(

      position=>{

        send({

          type:'location',

          lat:
            position.coords.latitude,

          lng:
            position.coords.longitude

        });

      },


      error=>{

        console.log(
          'Location unavailable',
          error.message
        );

      },


      {

        enableHighAccuracy:true,

        maximumAge:5000,

        timeout:10000

      }

    );

}



/* =========================================================
   ADDRESS LOOKUP
========================================================= */

async function geocodeOne(q){

  try{

    const response =
      await fetch(
        '/api/address?q=' +
        encodeURIComponent(q)
      );


    if(!response.ok){

      return null;

    }


    const results =
      await response.json();


    if(
      !results.length
    ){

      return null;

    }


    return {

      lat:
        Number(
          results[0].lat
        ),

      lng:
        Number(
          results[0].lon
        )

    };


  }catch(e){

    console.log(
      'Address lookup failed',
      e
    );


    return null;

  }

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ''
  )

  .replaceAll(
    '&',
    '&amp;'
  )

  .replaceAll(
    '<',
    '&lt;'
  )

  .replaceAll(
    '>',
    '&gt;'
  )

  .replaceAll(
    '"',
    '&quot;'
  )

  .replaceAll(
    "'",
    '&#039;'
  );

}
